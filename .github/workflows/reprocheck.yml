name: Reproducible Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Memoly version tag to independently rebuild
        required: true
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: reprocheck-${{ github.event.inputs.version || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  TAG_REF: ${{ github.event.inputs.version || github.event.release.tag_name }}
  CI_APP_TITLE: Memoly
  CI_APP_FILENAME: Memoly
  CI_PACKAGE_ID: im.memoly.app
  CI_BUILD_VARIANTS: '^prodStoreRelease$'
  CI_FORCE_INTERNAL_USER_FLAG: 'false'

jobs:
  build:
    name: Independently rebuild in Docker
    if: github.event_name == 'workflow_dispatch' || contains(github.event.release.tag_name, '-memoly.')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Validate Memoly tag
        run: '[[ "$TAG_REF" =~ ^v[0-9][A-Za-z0-9._-]*-memoly\.[0-9]+$ ]]'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TAG_REF }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/disk-cleanup
      - name: Build independent builder image
        run: docker compose build
        working-directory: reproducible-builds
      - name: Rebuild unsigned release without signing secrets
        run: docker compose run --rm assemble
        working-directory: reproducible-builds
      - name: Collect matching Memoly APK
        run: |
          shopt -s nullglob
          apks=(reproducible-builds/outputs/apk/prodStore/release/*-unsigned.apk)
          [[ ${#apks[@]} -eq 1 ]] || { echo '::error::Expected one independently rebuilt Memoly APK.'; exit 1; }
          mkdir rebuilt-apk
          cp "${apks[0]}" "rebuilt-apk/Memoly-$TAG_REF.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: independently-rebuilt-apk
          path: rebuilt-apk/
          if-no-files-found: error

  compare:
    name: Compare published APK contents
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TAG_REF }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: independently-rebuilt-apk
          path: rebuilt-apk
      - name: Download original APK and verify checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG_REF" --pattern 'Memoly-*.apk' --pattern SHA256SUMS --dir original-apk
          (cd original-apk && sha256sum --check --strict SHA256SUMS)
      - name: Compare APK contents excluding signature files
        run: python3 reproducible-builds/apkdiff/apkdiff.py "original-apk/Memoly-$TAG_REF.apk" "rebuilt-apk/Memoly-$TAG_REF.apk"
      - name: Upload mismatched entries
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reproducibility-mismatches
          path: mismatches/
          if-no-files-found: ignore
