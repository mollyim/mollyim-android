name: Ghostly Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Ghostly version (for example 1.0.0)"
        required: true
        type: string
  push:
    tags:
      - "ghostly-v*"

# Releases are deliberately restricted to the custom Ghostly branch/tag flow.
permissions:
  contents: write

env:
  BUILD_BRANCH: custom-branding-privacy
  BUILD_ENV_FILE: beta-stable.env
  HAVE_KEYSTORE: ${{ secrets.SECRET_KEYSTORE != '' }}

jobs:
  verify:
    name: Verify Ghostly source
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref_name, 'ghostly-v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: custom-branding-privacy

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Verify application label and branding
        run: |
          grep -q '<string name="custom_app_name"[^>]*>Ghostly</string>' app/src/main/res/values/custom_branding.xml
          grep -q 'Ghostly' app/src/main/res/values/strings.xml

      - name: Run unit tests
        run: ./gradlew test --no-daemon

  build:
    name: Build signed Ghostly APK
    needs: verify
    if: ${{ secrets.SECRET_KEYSTORE != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: custom-branding-privacy

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Build Docker image
        run: docker compose build
        working-directory: reproducible-builds

      - name: Export Ghostly build configuration
        run: |
          cp -v "ci/$BUILD_ENV_FILE" .env
          echo "CI_BUILD_VARIANTS=prod" >> $GITHUB_ENV
          echo "CI_APP_TITLE=Ghostly" >> $GITHUB_ENV
        working-directory: reproducible-builds

      - name: Extract signing key
        run: printenv KEYSTORE | base64 -d > certs/keystore.jks
        working-directory: reproducible-builds
        env:
          KEYSTORE: ${{ secrets.SECRET_KEYSTORE }}

      - name: Build and sign
        run: docker compose run -v "$GRADLE_USER_HOME/caches:/.gradle-ro-cache:ro" assemble
        working-directory: reproducible-builds
        env:
          CI_KEYSTORE_PATH: certs/keystore.jks
          CI_KEYSTORE_ALIAS: ${{ secrets.SECRET_KEYSTORE_ALIAS }}
          CI_KEYSTORE_PASSWORD: ${{ secrets.SECRET_KEYSTORE_PASSWORD }}

      - name: Verify APK label and package
        run: |
          APK=$(find outputs/apk -path '*/release/*.apk' -type f | head -n 1)
          test -n "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "application-label:'Ghostly'" /tmp/badging.txt

      - name: Generate SHA-256 checksums
        run: |
          find outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
        working-directory: reproducible-builds

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ghostly-apk
          path: reproducible-builds/outputs/apk/*/release/*.apk
          if-no-files-found: error

      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: ghostly-checksums
          path: reproducible-builds/SHA256SUMS

      - name: Clean signing key
        if: always()
        run: rm -f certs/keystore.jks
        working-directory: reproducible-builds

  release:
    name: Publish Ghostly release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ghostly-apk
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: ghostly-checksums
          path: dist

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#ghostly-v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=ghostly-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create non-draft Ghostly GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/*.apk dist/SHA256SUMS \
              --title "Ghostly v$VERSION" \
              --notes "Ghostly Android release v$VERSION. Built from custom-branding-privacy with unit tests, application branding verification, signed APK packaging, and SHA-256 checksums." \
              --latest
          fi
