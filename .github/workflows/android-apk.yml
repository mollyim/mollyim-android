name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - redtech-github-actions
      - custom-branding-privacy

permissions:
  contents: read

jobs:
  build:
    name: Build prodWebsiteRelease APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace assembleProdWebsiteRelease

      - name: List APK outputs
        run: find app/build/outputs/apk -type f -name '*.apk' -print

      - name: Generate SHA-256
        run: find app/build/outputs/apk -type f -name '*.apk' -exec sha256sum {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: redtech-molly-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
