# Scan notifications v1.2.0. No checkout, external action or package install.
name: Scan notifications
on:
  workflow_run:
    workflows: [Repository source guard]
    types: [completed]
permissions:
  checks: read
concurrency:
  group: pushover-scan-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false
jobs:
  notify:
    name: Send malware findings to Pushover
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Notify only on malware indicators
        env:
          GH_REPORT_TOKEN: ${{ github.token }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        shell: bash
        run: |
          python3 -I - <<'STELLAR_PUSHOVER_PY'
          """Send scan metadata to Pushover; standard library only, no repository checkout."""
          import http.client
          import datetime
          import json
          import os
          import pathlib
          import re
          import ssl
          import urllib.parse
          
          SCANNER_NAME = 'Repository source guard'
          SCANNER_PATH = '.github/workflows/stellar-source-guard.yml'
          HOST = 'api.pushover.net'
          ENDPOINT = '/1/messages.json'
          LABELS = {
              'success': 'Bestået. Se rapporten for eventuelle advarsler.',
              'failure': 'Ikke bestået: fund eller kørselsfejl. Se rapporten.',
              'cancelled': 'Afbrudt. Scanningen er ikke nødvendigvis fuldført.',
              'timed_out': 'Tidsgrænsen blev overskredet. Scanningen er ufuldstændig.',
              'action_required': 'Scanningen kræver handling i GitHub.',
              'startup_failure': 'Scanningen kunne ikke starte.',
              'skipped': 'Sprunget over. Ingen fuldført scanning.',
              'neutral': 'Afsluttet uden et bestået resultat. Se rapporten.',
              'stale': 'Resultatet er forældet. Se rapporten.',
          }
          
          
          class NotificationError(Exception):
              """Only constant, non-sensitive messages may reach the workflow log."""
          
          
          def positive_id(value):
              return type(value) is int and 0 < value < 10**20
          
          
          def message_fields(event, repository):
              if not re.fullmatch(r'StellerSecurity/[A-Za-z0-9_.-]{1,100}', repository):
                  raise NotificationError('Repository outside the configured organization.')
              run = event.get('workflow_run')
              if not isinstance(run, dict) or event.get('action') != 'completed':
                  raise NotificationError('Expected a completed workflow_run event.')
              if event.get('repository', {}).get('full_name') != repository:
                  raise NotificationError('Event repository does not match the workflow repository.')
              if run.get('repository', {}).get('full_name') != repository:
                  raise NotificationError('Scan repository does not match the workflow repository.')
              if run.get('name') != SCANNER_NAME or run.get('path') != SCANNER_PATH:
                  raise NotificationError('Event does not identify the configured scanner.')
              if run.get('status') != 'completed' or run.get('conclusion') not in LABELS:
                  raise NotificationError('Scan has no recognized final result.')
              if not all(positive_id(run.get(key)) for key in ('id', 'run_number', 'run_attempt')):
                  raise NotificationError('Scan identifiers are invalid.')
              # Do not forward PR text, commit messages, branch names, logs, artifacts or URLs
              # supplied in the event. In particular, pull_request_target's head_sha need not
              # be the commit inspected by the scanner, so it is not labelled as such here.
              return {
                  'title': 'Stellar: scanning afsluttet',
                  'message': '{}\n{}\nKørsel #{}, forsøg {}.'.format(
                      repository, LABELS[run['conclusion']], run['run_number'], run['run_attempt']),
                  'url': 'https://github.com/{}/actions/runs/{}/attempts/{}'.format(
                      repository, run['id'], run['run_attempt']),
                  'url_title': 'Se scanningen i GitHub',
                  'priority': '0',
                  'html': '0',
              }
          
          
          def github_json(path, token):
              connection = None
              try:
                  if not token:
                      raise NotificationError('GitHub report access is unavailable.')
                  connection = http.client.HTTPSConnection('api.github.com', timeout=20, context=ssl.create_default_context())
                  connection.request('GET', path, headers={'Authorization': 'Bearer ' + token,
                                     'Accept': 'application/vnd.github+json', 'User-Agent': 'Stellar-Source-Guard-Notifier/1.2'})
                  response = connection.getresponse()
                  if response.status != 200:
                      raise NotificationError('GitHub did not return the scan report.')
                  body = response.read(8 * 1024 * 1024 + 1)
                  if len(body) > 8 * 1024 * 1024:
                      raise NotificationError('GitHub report response is too large.')
                  return json.loads(body)
              except NotificationError:
                  raise
              except Exception:
                  raise NotificationError('GitHub report retrieval could not be confirmed.') from None
              finally:
                  if connection is not None:
                      connection.close()
          
          
          def report_counts(summary):
              # v2 lists the first 150 findings, all errors first, and states how many were
              # omitted. Count advisory IDs separately; aliases are not unique CVEs.
              blocking = re.search(r'^\d+ text files verified; \d+ exact dependency versions checked; (\d+) blocking findings\.$', summary, re.M)
              advisories = re.search(r'^(\d+) known vulnerability advisory IDs ', summary, re.M)
              if not summary.startswith('# Repository source guard\n') or not blocking or not advisories:
                  raise NotificationError('The scan report has no complete result counts.')
              if not summary.rstrip().endswith('Heuristic correlations are not full interprocedural data-flow analysis.'):
                  raise NotificationError('The scan report was truncated or its format changed.')
              section = summary.split('## Findings\n', 1)[1].split('\n## Vulnerability advisory IDs', 1)[0]
              levels = re.findall(r'^- \*\*(error|warning)(?: NEW)?\*\* ', section, re.M)
              omitted = re.findall(r'^- Additional findings omitted from this summary: (\d+)\.$', section, re.M)
              total = len(levels) + (int(omitted[0]) if len(omitted) == 1 else 0)
              errors = int(blocking.group(1))
              if len(omitted) > 1 or errors > total or (not omitted and levels.count('error') != errors):
                  raise NotificationError('The scan report has inconsistent counts.')
              return {'warnings': total - errors, 'advisories': int(advisories.group(1)), 'blocking': errors}
          
          
          def scan_counts(event, repository, token):
              run = event['workflow_run']
              start = datetime.datetime.fromisoformat(run['run_started_at'].replace('Z', '+00:00'))
              end = datetime.datetime.fromisoformat(run['updated_at'].replace('Z', '+00:00'))
              prefix = '/repos/' + repository
              paths = []
              if positive_id(run.get('check_suite_id')):
                  paths.append(prefix + '/check-suites/' + str(run['check_suite_id']) + '/check-runs')
              shas = {run.get('head_sha')}
              for pr in run.get('pull_requests', [])[:10]:
                  shas.add(pr.get('head', {}).get('sha'))
              paths += [prefix + '/commits/' + sha + '/check-runs' for sha in sorted(s for s in shas if isinstance(s, str))
                        if re.fullmatch(r'[0-9a-f]{40}', sha)]
              wanted_url = 'https://github.com/' + repository + '/actions/runs/' + str(run['id'])
              all_checks = {}
              for path in paths:
                  for page in range(1, 4):
                      checks = github_json(path + '?filter=all&per_page=100&page=' + str(page), token)['check_runs']
                      all_checks.update((c['id'], c) for c in checks)
                      if len(checks) < 100:
                          break
                      if page == 3:
                          raise NotificationError('The check history exceeds the safe matching limit.')
              checks = [c for c in all_checks.values() if c.get('name') == SCANNER_NAME
                        and c.get('app', {}).get('id') == 15368]
          
              def times(check):
                  return tuple(datetime.datetime.fromisoformat(check[k].replace('Z', '+00:00'))
                               for k in ('started_at', 'completed_at'))
          
              native = [c for c in checks if (c.get('details_url') or '').startswith(wanted_url + '/job/')
                        and c.get('status') == 'completed' and start <= times(c)[0] <= times(c)[1] <= end]
              if len(native) != 1:
                  raise NotificationError('The scan job could not be matched to this attempt.')
              job_start, job_end = times(native[0])
              # GitHub replaces details_url on checks created with GITHUB_TOKEN. Require
              # one report inside the exact native job window and reject overlapping jobs.
              for check in checks:
                  if check['id'] == native[0]['id'] or '/actions/runs/' not in (check.get('details_url') or ''):
                      continue
                  other_start = datetime.datetime.fromisoformat(check['started_at'].replace('Z', '+00:00'))
                  other_end = (datetime.datetime.fromisoformat(check['completed_at'].replace('Z', '+00:00'))
                               if check.get('completed_at') else end)
                  if other_start <= job_end and other_end >= job_start:
                      raise NotificationError('Overlapping scan jobs prevent an unambiguous report match.')
              reports = []
              for check in checks:
                  summary = check.get('output', {}).get('summary') or ''
                  if not summary.startswith('# Repository source guard\n') or check.get('status') != 'completed':
                      continue
                  if check.get('head_sha') not in shas or not job_start <= times(check)[0] <= times(check)[1] <= job_end:
                      continue
                  allowed_urls = (wanted_url, 'https://github.com/' + repository + '/runs/' + str(check['id']))
                  if check.get('details_url') not in allowed_urls:
                      continue
                  reports.append(check)
              if len(reports) != 1:
                  raise NotificationError('No unambiguous complete report was matched to this scan attempt.')
              counts = report_counts(reports[0]['output']['summary'])
              if reports[0].get('conclusion') != ('failure' if counts['blocking'] else 'success'):
                  raise NotificationError('The report result is inconsistent.')
              counts['malware'] = malware_signals(reports[0]['output']['summary'])
              return counts
          
          
          def malware_signals(summary):
              """Allow only explicit malicious-package matches and narrow code indicators.
          
              General CVE/GHSA vulnerability counts, age, CI weaknesses and obfuscation
              alone never qualify. Repository text is parsed as data, never executed.
              """
              section = summary.split('## Findings\n', 1)[1].split('\n## Vulnerability advisory IDs', 1)[0]
              grouped, dependencies = {}, set()
              visible_errors = 0
              for line in section.splitlines():
                  match = re.fullmatch(r'- \*\*(error|warning)(?: NEW)?\*\* ("(?:[^"\\]|\\.)*"):\d+ — ("(?:[^"\\]|\\.)*")', line)
                  if not match:
                      if line.startswith('- **error'):
                          raise NotificationError('A blocking finding could not be classified safely.')
                      continue
                  if match[1] != 'error':
                      continue
                  visible_errors += 1
                  path, rule = json.loads(match[2]), json.loads(match[3])
                  for _ in range(8):
                      cleaned = re.sub(r'^(?:decoded-content:|lifecycle:[^:]+:)', '', rule, count=1)
                      if cleaned == rule:
                          break
                      rule = cleaned
                  if rule.startswith(('decoded-content:', 'lifecycle:')):
                      raise NotificationError('Finding nesting exceeds the classification limit.')
                  if re.fullmatch(r'known-malicious-dependency:(?:MAL-\d{4}-\d+|GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4})', rule):
                      dependencies.add(rule)
                  grouped.setdefault(path, set()).add(rule)
              if visible_errors < report_counts(summary)['blocking']:
                  raise NotificationError('Omitted blocking findings require manual malware review.')
              signatures, behavior = set(), set()
              narrow = {'blockchain-addressed-loader-review', 'shell-reverse-connection',
                        'socket-shell-redirection', 'php-request-shell-execution'}
              encoded_execution = {'hidden-node-process', 'encoded-code-execution', 'php-encoded-execution',
                                   'encoded-function-execution', 'decoded-variable-execution'}
              for path, rules in grouped.items():
                  if {'known-loader-marker', 'obfuscated-code'} <= rules:
                      signatures.add(path)
                  if rules & narrow or ('obfuscated-code' in rules and rules & encoded_execution):
                      behavior.add(path)
              return {'known_loader': bool(signatures), 'malicious_dependency': bool(dependencies),
                      'strong_behavior': bool(behavior)}
          
          
          def malware_message(fields, event, counts):
              signals = counts['malware']
              if not any(signals.values()):
                  return None
              repo = event['repository']['full_name'].split('/', 1)[1]
              if signals['malicious_dependency']:
                  fields['title'] = '🚨 KENDT MALWARE I DEPENDENCY – ' + repo
              elif signals['known_loader']:
                  fields['title'] = '🚨 KENDT MALWARESIGNATUR – ' + repo
              else:
                  fields['title'] = '🚨 MULIG MALWARE/SPYWARE – ' + repo
              reasons = []
              if signals['malicious_dependency']:
                  reasons.append('En dependency-version matcher en databasepost klassificeret som malware.')
              if signals['known_loader']:
                  reasons.append('Koden matcher A9-loaderens markør sammen med kraftig obfuskering.')
              if signals['strong_behavior']:
                  reasons.append('Koden viser stærke indikatorer på skjult kodekørsel eller en bagdør. Fundet kræver kontrol.')
              fields['message'] = '\n'.join(reasons) + '\n\n' + fields['message']
              return fields
          
          
          def send_notification(fields, token, user):
              if not all(re.fullmatch(r'[A-Za-z0-9]{30}', value or '') for value in (token, user)):
                  raise NotificationError('Configure PUSHOVER_APP_TOKEN and PUSHOVER_USER_KEY as GitHub Actions secrets.')
              body = urllib.parse.urlencode(dict(fields, token=token, user=user)).encode('utf-8')
              connection = None
              try:
                  # Fixed HTTPS destination, verified TLS, no proxy/environment routing and
                  # no redirect handler. A redirect can never forward these credentials.
                  connection = http.client.HTTPSConnection(HOST, timeout=20, context=ssl.create_default_context())
                  connection.request('POST', ENDPOINT, body=body, headers={
                      'Content-Type': 'application/x-www-form-urlencoded',
                      'User-Agent': 'Stellar-Source-Guard-Notifier/1.2',
                  })
                  response = connection.getresponse()
                  if response.status != 200:
                      # Do not log response bodies, URLs, headers or exception details.
                      raise NotificationError('Pushover rejected the notification; check configuration or account quota.')
                  data = response.read(65537)
                  if len(data) > 65536:
                      raise NotificationError('Pushover response exceeded the permitted size.')
                  result = json.loads(data)
                  if not isinstance(result, dict) or type(result.get('status')) is not int or result['status'] != 1:
                      raise NotificationError('Pushover did not confirm acceptance of the notification.')
              except NotificationError:
                  raise
              except Exception:
                  # A timeout can occur after the service accepted the POST. Retrying
                  # automatically could send duplicates; report uncertain delivery instead.
                  raise NotificationError('Notification delivery could not be confirmed. No automatic retry was made.') from None
              finally:
                  if connection is not None:
                      try:
                          connection.close()
                      except Exception:
                          pass
          
          
          def main():
              try:
                  if os.environ.get('GITHUB_EVENT_NAME') != 'workflow_run':
                      raise NotificationError('This notifier only accepts workflow_run events.')
                  event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
                  fields = message_fields(event, os.environ['GITHUB_REPOSITORY'])
                  counts = scan_counts(event, os.environ['GITHUB_REPOSITORY'], os.environ.get('GH_REPORT_TOKEN', ''))
                  fields = malware_message(fields, event, counts)
                  if fields is None:
                      print('No qualifying malware/spyware indicators. No Pushover notification sent.')
                      return
                  send_notification(fields, os.environ.get('PUSHOVER_APP_TOKEN', ''), os.environ.get('PUSHOVER_USER_KEY', ''))
              except NotificationError as exc:
                  print('::error::' + str(exc))
                  raise SystemExit(1) from None
              except Exception:
                  print('::error::The notification event could not be processed safely.')
                  raise SystemExit(1) from None
              print('Pushover accepted the scan notification. Device delivery is not independently verified.')
          
          
          if __name__ == '__main__':
              main()
          STELLAR_PUSHOVER_PY
