name: Test

on:
  pull_request:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      profile:
        description: Verification scope
        type: choice
        options: [full, representative]
        default: full
  schedule:
    - cron: '20 18 * * 0'

permissions:
  contents: read

concurrency:
  group: test-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  choose-test-run:
    name: Choose test run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_tests: ${{ steps.check.outputs.run_tests }}
      profile: ${{ steps.check.outputs.profile }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select one verification run and scope
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REQUESTED_PROFILE: ${{ inputs.profile }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/scripts/choose-test-run.sh

  test:
    name: Run tests
    needs: choose-test-run
    if: needs.choose-test-run.outputs.run_tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PROFILE: ${{ needs.choose-test-run.outputs.profile }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check pipeline rejection and routing paths
        run: |
          for test in .github/scripts/test-*.py; do python3 "$test"; done
          for script in .github/scripts/*.sh; do bash -n "$script"; done
      - uses: ./.github/actions/disk-cleanup
        if: env.PROFILE != 'docs'
      - uses: ./.github/actions/setup-build
        if: env.PROFILE != 'docs'
        with:
          # Same-repository PR caches are scoped to that PR. Fork PRs stay read-only.
          cache-read-only: ${{ !(github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
      - name: Verify representative app and all common modules
        if: env.PROFILE == 'representative'
        run: ./gradlew -PciVerification=true '-PbuildVariants=^prodStoreDebug$' ciCheck
      - name: Verify all variants and modules
        if: env.PROFILE == 'full'
        run: ./gradlew -PciVerification=true ciCheck build
      - name: Record test coverage
        if: always() && env.PROFILE != 'docs'
        run: python3 .github/scripts/summarize-tests.py
      - name: Archive test and lint reports
        if: always() && env.PROFILE != 'docs'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports-${{ github.run_id }}
          path: |
            **/build/reports
            **/build/test-results
          if-no-files-found: ignore
