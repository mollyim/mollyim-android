name: Tag commit for personal release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New tag, for example v8.19.2-4-personal.1'
        required: true
        type: string
      publish:
        description: 'Publish after verification (otherwise leave a draft)'
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  push_tag:
    name: Tag selected commit
    runs-on: ubuntu-24.04
    env:
      TAG_REF: ${{ inputs.version }}

    steps:
      - name: Validate tag and signing secrets
        env:
          KEYSTORE: ${{ secrets.SECRET_KEYSTORE }}
          KEY_ALIAS: ${{ secrets.SECRET_KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SECRET_KEYSTORE_PASSWORD }}
        run: |
          [[ "$TAG_REF" =~ ^v[0-9][A-Za-z0-9._-]*-personal\.[0-9]+$ ]] || {
            echo '::error::Use a version tag ending in -personal.<number>.'
            exit 1
          }
          for name in KEYSTORE KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!name}" ]] || { echo '::error::Set all three signing secrets before tagging.'; exit 1; }
          done

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Create and push tag without replacing existing tags
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG_REF"; then
            echo '::error::Tag already exists. Rerun the release workflow for that tag.'
            exit 1
          fi
          git tag "$TAG_REF"
          git push origin "refs/tags/$TAG_REF"

  call_release_workflow:
    name: Build release
    needs: push_tag
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ inputs.version }}
      publish: ${{ inputs.publish }}
    secrets: inherit
