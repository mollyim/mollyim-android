# Stellar source guard v2.1.0. Repository content is data only.
# Package malware advisories and archives are checked by the separate commit worker.
name: Repository source guard
on:
  push:
    branches: ['**']
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
  schedule:
    - cron: '27 4 * * 1'
permissions:
  contents: read
  checks: write
  statuses: write
concurrency:
  group: source-guard-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    name: Repository source guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Read source and lifecycle scripts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 -I -B - <<'STELLAR_GUARD_PY'
          import base64, hashlib, zlib
          encoded = ''
          stream = zlib.decompressobj()
          source = stream.decompress(base64.b64decode(encoded, validate=True), 33765)
          if len(source) != 33764 or not stream.eof or stream.unused_data or stream.unconsumed_tail or hashlib.sha256(source).hexdigest() != 'd44f5fcf1f70c2239cb60352b43d29691dab865fb25ea9eaf6f7f9afa80375b4':
              raise RuntimeError('Reviewed source bytes differ')
          exec(compile(source, 'stellar_source_guard.py', 'exec'), {'__name__': '__main__'})
          STELLAR_GUARD_PY
