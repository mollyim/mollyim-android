          if len(raw) != 105081 or not inflater.eof or inflater.unused_data or inflater.unconsumed_tail: raise RuntimeError('Reviewed collector decompression differs')
          if hashlib.sha256(raw).hexdigest() != '94e013526c75a650bfdcf10ef971ccc445304ad4b78a53be1da8803e55f94470': raise RuntimeError('Reviewed collector hash differs')
          path = root / 'stellar_commit_dispatcher.py'
